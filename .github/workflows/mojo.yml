name: Mojo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-native-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.59.0
          cache: true
          locked: true
      - name: Build and exercise native search ABI
        run: pixi run mojo-check
