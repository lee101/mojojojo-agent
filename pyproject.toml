[project]
name = "mojojojo-agent"
dynamic = ["version"]
description = "A token-efficient coding agent harness with native search and native code execution"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Lee Penkman" }]
keywords = ["agent", "coding-agent", "mojo", "llm", "openai"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
full = ["pillow>=10.4", "prompt-toolkit>=3.0.52"]
tui = ["prompt-toolkit>=3.0.52"]
vision = ["pillow>=10.4"]
server = ["uvicorn>=0.30", "starlette>=0.37"]
accel = ["mojosub"]
syntax = ["tree-sitter-language-pack>=0.9"]

[project.scripts]
mjj = "mjj.cli:main"
mjj-search = "mjj.search.cli:main"

[project.urls]
Homepage = "https://mojojojo.cc/agent"
Documentation = "https://github.com/lee101/mojojojo-agent/tree/main/docs"
Source = "https://github.com/lee101/mojojojo-agent"
Issues = "https://github.com/lee101/mojojojo-agent/issues"

[dependency-groups]
dev = [
  "pillow>=10.4",
  "prompt-toolkit>=3.0.52",
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[tool.uv.sources]
mojosub = { git = "https://github.com/lee101/mojosub" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mjj"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.mjj",
  "/.pytest_cache",
  "/build",
  "/dist",
  "/visualbench/node_modules",
  "/visualbench/output",
  "**/__pycache__",
  "**/*.py[co]",
]

[tool.hatch.version]
path = "mjj/version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
