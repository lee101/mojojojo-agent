    const resize=()=>{const dpr=Math.min(devicePixelRatio,2),w=Math.max(1,Math.round(innerWidth*dpr)),h=Math.max(1,Math.round(innerHeight*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}};
    addEventListener("resize",resize); addEventListener("pointermove",event=>{pointerTarget=[event.clientX/innerWidth,1-event.clientY/innerHeight];}); addEventListener("click",event=>{if(event.target.tagName!=="BUTTON")running=!running;});
    document.querySelector("#mode").addEventListener("click",()=>{kind=kinds[(kinds.indexOf(kind)+1)%kinds.length];syncLabels();});
    document.querySelector("#palette").addEventListener("click",()=>{palette=palettes[(palettes.indexOf(palette)+1)%palettes.length];syncLabels();});
    const frame=now=>{resize();if(running)time+=Math.min((now-previous)/1000,.05);previous=now;pointer[0]+=(pointerTarget[0]-pointer[0])*.06;pointer[1]+=(pointerTarget[1]-pointer[1])*.06;gl.uniform2f(u.resolution,canvas.width,canvas.height);gl.uniform2f(u.pointer,pointer[0],pointer[1]);gl.uniform1f(u.time,time);gl.uniform1f(u.seed,config.seed);gl.uniform1i(u.kind,kinds.indexOf(kind));gl.uniform1i(u.palette,palettes.indexOf(palette));gl.uniform2f(u.imageSize,imageSize[0],imageSize[1]);gl.uniform1f(u.hasImage,hasImage);gl.drawArrays(gl.TRIANGLES,0,6);if(!ready){ready=true;document.body.dataset.ready="webgl";window.__VISUALBENCH_METRICS__={generator:"mjj visualize",kind,palette,firstFrameMilliseconds:Math.round(performance.now()-started),sourceImage:Boolean(hasImage)};window.__VISUALBENCH_READY__=true;}requestAnimationFrame(frame);};
    if(config.source){const image=new Image();image.onload=()=>{imageSize=[image.naturalWidth,image.naturalHeight];hasImage=1;gl.bindTexture(gl.TEXTURE_2D,texture);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,image);requestAnimationFrame(frame);};image.onerror=()=>requestAnimationFrame(frame);image.src=config.source;}else requestAnimationFrame(frame);
  })();
  </script>
